name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Tag Matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(sed -n '1p' VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Error: Tag ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)" >&2
            exit 1
          fi
          echo "Release version validated: $TAG_VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python Distribution (Wheel & sdist)
        run: |
          python -m pip install --upgrade pip build
          python -m build python/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.version.outputs.val || github.ref_name }}"
          generate_release_notes: true
          files: |
            contracts/openapi/network-world-state.openapi.json
            python/dist/*.whl
            python/dist/*.tar.gz
